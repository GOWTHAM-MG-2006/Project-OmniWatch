# OmniWatch agent default configuration (Task T2)
agent:
  collection_interval: 60s
  log_level: info
receiver:
  hostmetrics:
    collection_interval: 15s
    scrapers:
      cpu:
      memory:
      disk:
      network:
      filesystem:
      load:
  filelog:
    include:
      - /var/log/pods/*/*/*.log
      - /var/log/containers/*/*.log
      - /var/log/kubernetes/audit/*.log
    exclude:
      - /var/log/pods/*/*/**.gz
    start_at: beginning
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.time
          layout: RFC3339
        severity:
          parse_from: attributes.level
  k8s_objects:
    collection_interval: 15m
    mode: pull # watch or pull
    label_selector: ""
    field_selector: ""
  k8s_cluster:
    collection_interval: 10m
    node_conditions_to_report:
      - Ready
      - MemoryPressure
      - DiskPressure
      - PIDPressure
      - NetworkUnavailable
exporter:
  otlp:
    endpoint: otel-collector:4317
    insecure: true
