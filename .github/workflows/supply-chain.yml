# OmniWatch supply chain (IND-8): reproducible build -> SBOM -> keyless sign.
# Trigger: tag push (v*). Keyless cosign via GitHub OIDC (no keys/HSM).
# NOTE for Task 9 E2E pipeline: add a `cosign verify` step after deploy,
# e.g. `cosign verify ghcr.io/<org>/omniwatch-agent:${{ github.ref_name }}`.
name: supply-chain

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # attach SBOM to the release
  packages: write # push image to GHCR
  id-token: write # keyless cosign OIDC

jobs:
  build-sbom-sign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase GHCR image
        run: |
          OWNER=${{ github.repository_owner }}
          echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${OWNER,,}/omniwatch-agent:${{ github.ref_name }}" >> "$GITHUB_ENV"

      - name: Set SOURCE_DATE_EPOCH from last commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build reproducible image
        run: make build-reproducible IMAGE="${{ env.IMAGE }}" SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH"

      - name: Push image
        run: docker push "${{ env.IMAGE }}"

      - name: Generate SBOM (SPDX 2.3)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Check SBOM is SPDX 2.3
        run: python -c "import json;d=json.load(open('sbom.spdx.json'));assert d['spdxVersion'].startswith('SPDX-2.3'),d.get('spdxVersion');print('SBOM OK:',d['spdxVersion'])" # noqa: E501

      - uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless OIDC)
        run: cosign sign --yes "${{ env.IMAGE }}"

      - name: Verify signature (keyless)
        run: cosign verify "${{ env.IMAGE }}"

      - name: Attach SBOM to release
        uses: softprops/action-gh-release@v2
        with:
          files: sbom.spdx.json
