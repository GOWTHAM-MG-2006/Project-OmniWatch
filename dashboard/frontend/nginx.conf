# ---------------------------------------------------------------------------
# OmniWatch — Dashboard Frontend nginx Configuration
# Phase: 11
# Purpose: Serve built React SPA and proxy /api requests to dashboard-api:8011
# Inputs:  Static files from Vite build (dist/)
# Outputs: HTTP on port 3000 — SPA routes + /api proxy
# ---------------------------------------------------------------------------

server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # -- Gzip compression for static assets --
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # -- Streaming pull — must not time out while Ollama downloads GBs ----
    # Keep SSE bytes flowing for up to 30 minutes; disable buffering so
    # progress chunks reach the browser immediately.
    location = /api/ollama/pull {
        proxy_pass http://dashboard-api:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # -- Proxy /identity/* to identity service (auth, sessions, registration) --
    location /identity/ {
        proxy_pass http://identity:8012/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # -- Proxy /api/* to dashboard-api backend --
    location /api/ {
        proxy_pass http://dashboard-api:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # -- Proxy /genai/* and /copilot/* to dashboard-api (no /api prefix) --
    location /genai/ {
        proxy_pass http://dashboard-api:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /copilot {
        proxy_pass http://dashboard-api:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # -- SPA fallback — serve index.html for all client-side routes --
    location / {
        try_files $uri $uri/ /index.html;
    }

    # -- Cache static assets (hashed filenames from Vite) --
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # -- Health check endpoint --
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
