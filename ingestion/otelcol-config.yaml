# ============================================================================
# OmniWatch — OpenTelemetry Collector Configuration
# Component: otelcol-config.yaml
# Phase: 2
# Purpose: Receives ALL telemetry via OTLP and routes to Kafka for Flink processing
# Receives: OTLP gRPC/HTTP (metrics, logs, traces)
# Exports: Kafka (all raw telemetry for Flink normalization/enrichment)
# OTel Collector Version: v0.157.0+ (franz-go based Kafka client)
# ============================================================================

receivers:
  # OTLP receiver — accepts gRPC and HTTP traces/metrics/logs from simulators
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batch processor — batches telemetry before export
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Memory limiter — prevents OOM by limiting memory usage
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Resource detection — adds host metadata to telemetry
  resourcedetection:
    detectors: ["env", "system"]
    timeout: 5s

  # Resource — adds OmniWatch-specific labels
  resource:
    attributes:
      - key: deployment.environment
        value: "simulation"
        action: upsert
      - key: service.namespace
        value: "omniwatch"
        action: upsert

exporters:
  # Kafka exporter — publishes all raw telemetry to signal-specific topics
  # Phase 2 routes ONLY to Kafka; ClickHouse is downstream (Phase 5)
  # Uses signal-level topic configs (franz-go client, v0.157+)
  kafka:
    brokers: ["kafka:29092"]
    metrics:
      topic: "omniwatch.metrics.raw"
      encoding: "otlp_json"
    traces:
      topic: "omniwatch.traces.raw"
      encoding: "otlp_json"
    logs:
      topic: "omniwatch.logs.raw"
      encoding: "otlp_json"
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  # Debug exporter — logs telemetry to stdout (for debugging)
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888

  pipelines:
    # Metrics pipeline: OTLP → Kafka only (Phase 2; Flink consumes from Kafka)
    metrics:
      receivers: ["otlp"]
      processors: ["memory_limiter", "resourcedetection", "resource", "batch"]
      exporters: ["kafka", "debug"]

    # Traces pipeline: OTLP → Kafka only
    traces:
      receivers: ["otlp"]
      processors: ["memory_limiter", "resourcedetection", "resource", "batch"]
      exporters: ["kafka", "debug"]

    # Logs pipeline: OTLP → Kafka only
    logs:
      receivers: ["otlp"]
      processors: ["memory_limiter", "resourcedetection", "resource", "batch"]
      exporters: ["kafka", "debug"]
