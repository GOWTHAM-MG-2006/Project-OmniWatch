# ============================================================================
# OmniWatch — OpenTelemetry Collector Configuration
# Component: otelcol-config.yaml
# Phase: 2
# Purpose: Receives ALL telemetry via OTLP and routes to Kafka + ClickHouse
# Receives: OTLP gRPC/HTTP (metrics, logs, traces)
# Exports: Kafka (all raw telemetry for Flink processing), ClickHouse (all telemetry)
# ============================================================================

receivers:
  # OTLP receiver — accepts gRPC and HTTP traces/metrics/logs from simulators
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Batch processor — batches telemetry before export
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Memory limiter — prevents OOM by limiting memory usage
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Resource detection — adds host metadata to telemetry
  resourcedetection:
    detectors: ["env", "system"]
    timeout: 5s

  # Resource — adds OmniWatch-specific labels
  resource:
    attributes:
      - key: deployment.environment
        value: "simulation"
        action: upsert
      - key: service.namespace
        value: "omniwatch"
        action: upsert

exporters:
  # ClickHouse exporter — unified storage for ALL telemetry (metrics, logs, traces)
  clickhouse:
    endpoint: "tcp://clickhouse:9000"
    database: "omniwatch"
    resource_to_telemetry_conversion:
      enabled: true
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  # Kafka exporter — publishes all raw telemetry to Kafka for Flink processing
  kafka:
    brokers: ["kafka:9092"]
    topic: "omniwatch.metrics.raw"
    encoding: "json"

  # Kafka exporter for traces
  kafka/traces:
    brokers: ["kafka:9092"]
    topic: "omniwatch.traces.raw"
    encoding: "json"

  # Kafka exporter for logs
  kafka/logs:
    brokers: ["kafka:9092"]
    topic: "omniwatch.logs.raw"
    encoding: "json"

  # Kafka exporter for security events
  kafka/security:
    brokers: ["kafka:9092"]
    topic: "omniwatch.security.events"
    encoding: "json"

  # Debug exporter — logs telemetry to stdout (for debugging)
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      address: 0.0.0.0:8888

  pipelines:
    # Metrics pipeline: OTLP → ClickHouse + Kafka
    metrics:
      receivers: ["otlp"]
      processors: ["memory_limiter", "resourcedetection", "resource", "batch"]
      exporters: ["clickhouse", "kafka", "debug"]

    # Traces pipeline: OTLP → Kafka + ClickHouse
    traces:
      receivers: ["otlp"]
      processors: ["memory_limiter", "resourcedetection", "resource", "batch"]
      exporters: ["kafka/traces", "clickhouse", "debug"]

    # Logs pipeline: OTLP → Kafka + ClickHouse
    logs:
      receivers: ["otlp"]
      processors: ["memory_limiter", "resourcedetection", "resource", "batch"]
      exporters: ["kafka/logs", "clickhouse", "debug"]

    # Security events pipeline: OTLP → Kafka
    security:
      receivers: ["otlp"]
      processors: ["memory_limiter", "resourcedetection", "resource", "batch"]
      exporters: ["kafka/security", "debug"]
