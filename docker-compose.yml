networks:
  omniwatch-network:
    driver: bridge

volumes:
  zookeeper-data:
  kafka-data:
  clickhouse-data:
  neo4j-data:
  neo4j-logs:
  minio-data:
  ollama-data:
  flink-jobmanager-data:

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: omniwatch-zookeeper
    networks:
      - omniwatch-network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: omniwatch-kafka
    networks:
      - omniwatch-network
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: omniwatch-clickhouse
    networks:
      - omniwatch-network
    ports:
      - "9000:9000"
      - "8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: omniwatch
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.13-community
    container_name: omniwatch-neo4j
    networks:
      - omniwatch-network
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/omniwatch
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: omniwatch-minio
    networks:
      - omniwatch-network
    ports:
      - "9001:9001"
      - "19000:9010"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --address ":9010" --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    container_name: omniwatch-ollama
    runtime: nvidia
    networks:
      - omniwatch-network
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  opa:
    image: openpolicyagent/opa:latest-static
    container_name: omniwatch-opa
    networks:
      - omniwatch-network
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--log-level=info"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    volumes:
      - ./orchestration/policies:/policies
    healthcheck:
      test: ["CMD", "/opa", "version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: omniwatch-otelcol
    networks:
      - omniwatch-network
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    volumes:
      - ./ingestion/otelcol-config.yaml:/etc/otelcol-contrib/config.yaml
    depends_on:
      kafka:
        condition: service_healthy
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

  # ---------------------------------------------------------------------------
  # Flink — Stream processing engine (Phase 2)
  # ---------------------------------------------------------------------------
  flink-jobmanager:
    image: flink:1.17-scala_2.12
    container_name: omniwatch-flink-jobmanager
    networks:
      - omniwatch-network
    ports:
      - "8081:8081"
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      KAFKA_GROUP_ID: flink-entity-resolution-v2
    command: jobmanager
    volumes:
      - flink-jobmanager-data:/opt/flink/log
      - ./ingestion/flink/build/libs:/jobs
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  flink-taskmanager:
    image: flink:1.17-scala_2.12
    container_name: omniwatch-flink-taskmanager
    networks:
      - omniwatch-network
    environment:
      JOB_MANAGER_RPC_ADDRESS: flink-jobmanager
      TASK_MANAGER_NUMBER_OF_TASK_SLOTS: 4
      KAFKA_GROUP_ID: flink-entity-resolution-v2
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_started
    volumes:
      - ./ingestion/flink/build/libs:/jobs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://flink-jobmanager:8081"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # ---------------------------------------------------------------------------
  # Entity Resolution — Phase 3 Flink job (submitted to the shared cluster)
  # ---------------------------------------------------------------------------
  entity-resolution:
    build:
      context: ./entity-resolution/flink
      dockerfile: Dockerfile
    container_name: omniwatch-entity-resolution
    command: ["sh", "-c", "for i in $(seq 1 60); do flink run -d -m flink-jobmanager:8081 -c com.omniwatch.entity.EntityResolutionJob /opt/flink/jobs/omniwatch-entity-resolution-job-v2.jar && break; echo \"retry $$i\"; sleep 5; done; sleep infinity"]
    networks:
      - omniwatch-network
    volumes:
      - ./entity-resolution/flink/build/libs:/jobs
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OUTPUT_TOPICS: omniwatch.entities.resolved;omniwatch.entities.relationships
      KAFKA_GROUP_ID: flink-entity-resolution-v2
    depends_on:
      kafka:
        condition: service_healthy
      flink-jobmanager:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://flink-jobmanager:8081/jobs/overview | grep -q '\"state\":\"RUNNING\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ---------------------------------------------------------------------------
  # MinIO Bucket Init — creates required buckets before Flink starts
  # ---------------------------------------------------------------------------
  minio-bucket-init:
    image: minio/mc:latest
    container_name: omniwatch-minio-init
    networks:
      - omniwatch-network
    entrypoint: ["sh", "-c"]
    command: >
      "sleep 5 &&
       mc alias set omniwatch http://minio:9010 minioadmin minioadmin &&
       mc mb omniwatch/omniwatch-telemetry-archive --ignore-existing &&
       mc mb omniwatch/omniwatch-incidents --ignore-existing &&
       mc mb omniwatch/omniwatch-audit-logs --ignore-existing &&
       mc mb omniwatch/omniwatch-runbooks --ignore-existing &&
       mc mb omniwatch/omniwatch-ml-datasets --ignore-existing &&
       mc mb omniwatch/omniwatch-dashboards --ignore-existing &&
       echo 'All 6 buckets ready'"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    profiles: ["setup"]

  api-gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    container_name: omniwatch-api-gateway
    networks:
      - omniwatch-network
    ports:
      - "8000:8000"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4317
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      otelcol:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  user-service:
    build:
      context: .
      dockerfile: services/user_service/Dockerfile
    container_name: omniwatch-user-service
    networks:
      - omniwatch-network
    ports:
      - "8001:8001"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4317
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      otelcol:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  order-service:
    build:
      context: .
      dockerfile: services/order_service/Dockerfile
    container_name: omniwatch-order-service
    networks:
      - omniwatch-network
    ports:
      - "8002:8002"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otelcol:4317
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
      otelcol:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Feature Store — Phase 4 Flink job (windowed feature computation)
  # ---------------------------------------------------------------------------
  feature-store-flink:
    build:
      context: ./feature-store/flink
      dockerfile: Dockerfile
    container_name: omniwatch-feature-store-flink
    command: ["sh", "-c", "for i in $(seq 1 60); do flink run -d -m flink-jobmanager:8081 -c com.omniwatch.features.FeatureStoreJob /opt/flink/jobs/omniwatch-feature-store-job.jar --kafka.brokers kafka:29092 --kafka.group.id flink-feature-store-v2 --clickhouse.host clickhouse --clickhouse.port 8123 --clickhouse.db omniwatch && break; echo \"retry $$i\"; sleep 5; done; sleep infinity"]
    networks:
      - omniwatch-network
    volumes:
      - ./feature-store/flink/build/libs:/jobs
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: omniwatch
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      flink-jobmanager:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://flink-jobmanager:8081/jobs/overview | grep -q '\"state\":\"RUNNING\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ---------------------------------------------------------------------------
  # Feature Store API — serves computed feature vectors (Phase 4)
  # ---------------------------------------------------------------------------
  feature-store-api:
    build:
      context: ./feature-store/api
      dockerfile: Dockerfile
    container_name: omniwatch-feature-store-api
    networks:
      - omniwatch-network
    ports:
      - "8005:8005"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: omniwatch
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Predictive Intelligence — Phase 6 (anomaly detection + security classifier)
  # ---------------------------------------------------------------------------
  predictive:
    build:
      context: .
      dockerfile: predictive/Dockerfile
    container_name: omniwatch-predictive
    networks:
      - omniwatch-network
    ports:
      - "8007:8007"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: omniwatch
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: omniwatch
      MINIO_ENDPOINT: minio:9010
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      MINIO_CONSOLE_PORT: 9001
      PREDICTIVE_ANOMALY_SCORE_THRESHOLD: 0.5
      PREDICTIVE_CONFIDENCE_THRESHOLD: 60.0
      PREDICTIVE_COLD_START_SAMPLE_COUNT: 30
      PREDICTIVE_NOISE_FILTER_WINDOW: 5
      PREDICTIVE_SEASONALITY_PERIOD: 24
      PREDICTIVE_LOOKBACK_WINDOW: 168
      PREDICTIVE_SECURITY_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Causal Graph Engine — Phase 7 (PyRCA DAG traversal → root cause)
  # ---------------------------------------------------------------------------
  causal:
    build:
      context: .
      dockerfile: causal/Dockerfile
    container_name: omniwatch-causal
    networks:
      - omniwatch-network
    ports:
      - "8008:8008"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: omniwatch-causal-group
      KAFKA_AUTO_OFFSET_RESET: earliest
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: omniwatch
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: omniwatch
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CAUSAL_MAX_DEPTH: 10
      CAUSAL_MIN_CONFIDENCE: 0.3
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      predictive:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Incident Prioritization Engine — Phase 8 (severity, dedup, assignment)
  # ---------------------------------------------------------------------------
  prioritization:
    build:
      context: .
      dockerfile: prioritization/Dockerfile
    container_name: omniwatch-prioritization
    networks:
      - omniwatch-network
    ports:
      - "8009:8009"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: omniwatch-prioritization-group
      KAFKA_AUTO_OFFSET_RESET: earliest
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: omniwatch
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      DEDUP_TTL_SECONDS: 300
      DEDUP_ENABLED: "true"
      MINIO_ENDPOINT: minio:9010
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_INCIDENTS_BUCKET: omniwatch-incidents
      MINIO_SECURE: "false"
      PRIORITIZATION_API_PORT: 8009
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Generative AI Engine — Phase 10 (grounded LLM, compliance reports)
  # ---------------------------------------------------------------------------
  genai-service:
    build:
      context: .
      dockerfile: genai/Dockerfile
    container_name: omniwatch-genai
    networks:
      - omniwatch-network
    ports:
      - "8020:8020"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: omniwatch
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      MINIO_ENDPOINT: minio:9010
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      MINIO_AUTO_CREATE: "true"
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: qwen3:8b
      LLM_BACKEND: ollama
      VLLM_BASE_URL: http://localhost:8000
      GENAI_API_PORT: "8020"
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8020/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # GenAI Kafka Consumer — Phase 10 (incident → summary/report/postmortem;
  #                                remediation → runbook, persist + publish)
  # ---------------------------------------------------------------------------
  genai-consumer:
    build:
      context: .
      dockerfile: genai/Dockerfile
    container_name: omniwatch-genai-consumer
    networks:
      - omniwatch-network
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: omniwatch
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      MINIO_ENDPOINT: minio:9010
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      MINIO_AUTO_CREATE: "true"
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: qwen3:8b
      LLM_BACKEND: ollama
      VLLM_BASE_URL: http://localhost:8000
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy
    command: ["python", "-m", "genai.genai_consumer"]
    # Necessary (GAP 4): no HTTP endpoint here, so probe Kafka readiness instead of the Dockerfile's dead :8020/health.
    healthcheck:
      test: ["CMD-SHELL", "python -c 'from confluent_kafka import Consumer; c=Consumer({\"bootstrap.servers\":\"kafka:29092\",\"group.id\":\"hc-genai-consumer\"}); c.list_topics(timeout=5); c.close()' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Dashboard API — Phase 11 (backend for React dashboard frontend)
  # ---------------------------------------------------------------------------
  dashboard-api:
    build:
      context: .
      dockerfile: dashboard/api/Dockerfile
    container_name: omniwatch-dashboard-api
    networks:
      - omniwatch-network
    ports:
      - "8011:8011"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: omniwatch
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: omniwatch
      MINIO_ENDPOINT: minio:9010
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      DASHBOARD_PORT: "8011"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3:8b
      LEARNING_SERVICE_URL: http://learning:8030
      GENAI_SERVICE_URL: http://genai:8020
      ORCHESTRATION_SERVICE_URL: http://orchestration:8010
    depends_on:
      clickhouse:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Dashboard Frontend — Phase 11 (React SPA served by nginx)
  # ---------------------------------------------------------------------------
  dashboard-frontend:
    build:
      context: .
      dockerfile: dashboard/frontend/Dockerfile
    container_name: omniwatch-dashboard-frontend
    networks:
      - omniwatch-network
    ports:
      - "3000:3000"
    depends_on:
      dashboard-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Orchestration Engine — Phase 9 (OPA + auto-remediation)
  # ---------------------------------------------------------------------------
  orchestration-engine:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    container_name: omniwatch-orchestration
    networks:
      - omniwatch-network
    ports:
      - "8010:8010"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: omniwatch
      OPA_URL: http://opa:8181
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: omniwatch
      MINIO_ENDPOINT: minio:9010
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "false"
      OMNIWATCH_APPROVAL_SELECT_PENDING: "true"
      OMNIWATCH_APPROVAL_UPDATE_DECISION: "true"
      OMNIWATCH_APPROVAL_LEARNING_PRODUCER: "true"
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      opa:
        condition: service_started
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Continuous Learning Service — Phase 11 (feedback loop + pattern mining)
  # ---------------------------------------------------------------------------
  learning:
    build:
      context: .
      dockerfile: learning/Dockerfile
    container_name: omniwatch-learning
    networks:
      - omniwatch-network
    ports:
      - "8030:8030"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_LEARNING_GROUP_ID: omniwatch-learning-group
      KAFKA_AUTO_OFFSET_RESET: earliest
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_DB: omniwatch
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: omniwatch
      LEARNING_API_PORT: "8030"
      PATTERN_MINING_INTERVAL: "900"
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      neo4j:
        condition: service_healthy
