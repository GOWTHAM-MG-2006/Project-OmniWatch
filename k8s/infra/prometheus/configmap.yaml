apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: omniwatch
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: omniwatch
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: omniwatch-otel-collector
        static_configs:
          - targets: ["host.docker.internal:8889"]
        metrics_path: /metrics
