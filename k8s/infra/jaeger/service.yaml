apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: omniwatch
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: omniwatch
spec:
  ports:
    - port: 16686
      targetPort: 16686
      name: ui
    - port: 4317
      targetPort: 4317
      name: grpc-otlp
    - port: 4318
      targetPort: 4318
      name: http-otlp
  selector:
    app.kubernetes.io/name: jaeger
