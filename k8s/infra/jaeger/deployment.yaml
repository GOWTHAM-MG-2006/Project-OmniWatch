apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: omniwatch
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: omniwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.50
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 4317
              name: grpc-otlp
            - containerPort: 4318
              name: http-otlp
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          startupProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 15
            periodSeconds: 10
