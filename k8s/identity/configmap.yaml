apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-config
  namespace: omniwatch
  labels:
    app: identity
    tier: backend
    phase: "entry-point"
data:
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DB: omniwatch
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: ""
  IDENTITY_PORT: "8012"
  IDENTITY_STORE: memory
  # DYN-python passthrough: OMNIWATCH_* primary names mirror the bare names
  # above (same values; app prefers OMNIWATCH_* with bare fallback).
  OMNIWATCH_ENV: dev
  # NOTE: OMNIWATCH_JWT_SECRET is INTENTIONALLY absent here — prod injects it
  # via a Secret / external env (never a ConfigMap value). Unset in dev means
  # the dev default + loud WARN; OMNIWATCH_ENV=prod without it fail-fasts.
  OMNIWATCH_JWT_TTL_S: "3600"
  OMNIWATCH_JWT_REFRESH_TTL_S: "86400"
  OMNIWATCH_IDENTITY_PORT: "8012"
  OMNIWATCH_IDENTITY_STORE: memory
  OMNIWATCH_CLICKHOUSE_HOST: clickhouse
  OMNIWATCH_CLICKHOUSE_HTTP_PORT: "8123"
  OMNIWATCH_CLICKHOUSE_DB: omniwatch
  OMNIWATCH_CLICKHOUSE_USER: default
  OMNIWATCH_CLICKHOUSE_PASSWORD: ""
