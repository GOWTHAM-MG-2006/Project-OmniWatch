apiVersion: v1
kind: ConfigMap
metadata:
  name: learning-config
  namespace: omniwatch
  labels:
    app: learning
    tier: backend
    phase: "11"
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_LEARNING_GROUP_ID: omniwatch-learning-group
  KAFKA_AUTO_OFFSET_RESET: earliest
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DB: omniwatch
  CLICKHOUSE_USER: default
  CLICKHOUSE_PASSWORD: ""
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: omniwatch
  LEARNING_API_PORT: "8030"
  PATTERN_MINING_INTERVAL: "900"
  # DYN-python passthrough: OMNIWATCH_* primary names mirror the bare names
  # above (same values; app prefers OMNIWATCH_* with bare fallback).
  OMNIWATCH_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  OMNIWATCH_CLICKHOUSE_HOST: clickhouse
  OMNIWATCH_CLICKHOUSE_HTTP_PORT: "8123"
  OMNIWATCH_CLICKHOUSE_DB: omniwatch
  OMNIWATCH_CLICKHOUSE_USER: default
  OMNIWATCH_CLICKHOUSE_PASSWORD: ""
  OMNIWATCH_NEO4J_URI: bolt://neo4j:7687
  OMNIWATCH_NEO4J_USER: neo4j
  OMNIWATCH_NEO4J_PASSWORD: omniwatch
  OMNIWATCH_KAFKA_TOPICS_ACTIONS: omniwatch.remediation.actions
  OMNIWATCH_PATTERN_MINING_INTERVAL: "900"
  OMNIWATCH_LEARNING_PORT: "8030"
  OMNIWATCH_LEADER_ELECTION_ENABLED: "false"
  OMNIWATCH_LEADER_ELECTION_LEASE_NAME: omniwatch-learning-leader
  OMNIWATCH_LEADER_ELECTION_LEASE_NAMESPACE: omniwatch
  OMNIWATCH_LEADER_ELECTION_LEASE_DURATION: "15"
