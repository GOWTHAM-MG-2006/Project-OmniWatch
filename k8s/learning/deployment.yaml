apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning
  namespace: omniwatch
  labels:
    app: learning
    tier: backend
    phase: "11"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learning
  template:
    metadata:
      labels:
        app: learning
        tier: backend
        phase: "11"
    spec:
      serviceAccountName: learning
      containers:
        - name: omniwatch-learning
          image: omniwatch/learning:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8030
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: learning-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8030
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8030
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
