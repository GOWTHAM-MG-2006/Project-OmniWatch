# OmniWatch — Phase 11 Continuous Learning
# Component: leader-election RBAC (IND-7)
# Minimal namespaced permissions for the K8s Lease singleton gate in
# learning/learning_service.py (common/leaderelection.py K8sLeaseBackend).
# Scope: coordination.k8s.io leases in namespace omniwatch ONLY.
# No ClusterRole touched, no existing role broadened.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: learning
  namespace: omniwatch
  labels:
    app: learning
    tier: backend
    phase: "11"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: learning-leader-election
  namespace: omniwatch
  labels:
    app: learning
    tier: backend
    phase: "11"
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: learning-leader-election
  namespace: omniwatch
  labels:
    app: learning
    tier: backend
    phase: "11"
subjects:
  - kind: ServiceAccount
    name: learning
    namespace: omniwatch
roleRef:
  kind: Role
  name: learning-leader-election
  apiGroup: rbac.authorization.k8s.io
