apiVersion: v1
kind: ConfigMap
metadata:
  name: causal-config
  namespace: omniwatch
  labels:
    app: causal
    tier: backend
    phase: "7"
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_GROUP_ID: omniwatch-causal-group
  KAFKA_AUTO_OFFSET_RESET: earliest
  CAUSAL_MAX_DEPTH: "10"
  CAUSAL_MIN_CONFIDENCE: "0.3"
  # IND-7 leader election (K8s Lease singleton). Disabled by default:
  # replicas run standalone exactly as before. Set ENABLED to "true"
  # (and grant k8s/causal/rbac.yaml) for 1-leader/N-replica mode.
  OMNIWATCH_LEADER_ELECTION_ENABLED: "false"
  OMNIWATCH_LEADER_ELECTION_LEASE_NAME: omniwatch-causal-leader
  OMNIWATCH_LEADER_ELECTION_LEASE_NAMESPACE: omniwatch
  OMNIWATCH_LEADER_ELECTION_LEASE_DURATION: "15"
