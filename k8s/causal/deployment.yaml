apiVersion: apps/v1
kind: Deployment
metadata:
  name: causal
  namespace: omniwatch
  labels:
    app: causal
    tier: backend
    phase: "7"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: causal
  template:
    metadata:
      labels:
        app: causal
        tier: backend
        phase: "7"
    spec:
      containers:
        - name: omniwatch-causal
          image: omniwatch/causal:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8008
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: causal-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8008
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
