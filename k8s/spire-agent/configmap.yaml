# OmniWatch — industry-ready (IND-1)
# Component: spire-agent config (trust domain example.org matches agent default)
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-agent-config
  namespace: omniwatch
  labels:
    app: spire-agent
    tier: backend
    phase: "industry"
data:
  agent.conf: |
    agent {
      data_dir = "/run/spire"
      log_level = "INFO"
      server_address = "spire-server.omniwatch"
      server_port = "8081"
      socket_path = "/tmp/spire-agent/public/api.sock"
      trust_bundle_path = "/run/spire/bootstrap.crt"
      trust_domain = "example.org"
    }

    plugins {
      NodeAttestor "join_token" {
        plugin_data {
        }
      }
      KeyManager "disk" {
        plugin_data {
          keys_path = "/run/spire/keys.json"
        }
      }
      WorkloadAttestor "k8s" {
        plugin_data {
          skip_kubelet_verification = true
        }
      }
      WorkloadAttestor "unix" {
        plugin_data {
        }
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "127.0.0.1"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }
