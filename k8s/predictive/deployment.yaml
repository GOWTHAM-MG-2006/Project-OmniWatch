# OmniWatch — Phase 6 Predictive Intelligence
# Component: predictive Deployment (Merlion anomaly detection + security classifier)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictive
  namespace: omniwatch
  labels:
    app: predictive
    tier: backend
    phase: "6"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: predictive
  template:
    metadata:
      labels:
        app: predictive
        tier: backend
        phase: "6"
    spec:
      containers:
        - name: omniwatch-predictive
          image: omniwatch/predictive:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8007
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: predictive-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8007
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8007
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
