# OmniWatch — Phase 4 Windowing Layer + Feature Store
# Component: feature-store-flink Deployment (Flink streaming job)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-store-flink
  namespace: omniwatch
  labels:
    app: feature-store-flink
    tier: backend
    phase: "4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feature-store-flink
  template:
    metadata:
      labels:
        app: feature-store-flink
        tier: backend
        phase: "4"
    spec:
      containers:
        - name: feature-store-flink
          image: gcr.io/omniwatch/feature-store-flink:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
              protocol: TCP
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otelcol:4317
          envFrom:
            - configMapRef:
                name: feature-store-flink-config
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
