# OmniWatch — Phase 4 Windowing Layer + Feature Store
# Component: feature-store-api Deployment (FastAPI feature server)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: feature-store-api
  namespace: omniwatch
  labels:
    app: feature-store-api
    tier: backend
    phase: "4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: feature-store-api
  template:
    metadata:
      labels:
        app: feature-store-api
        tier: backend
        phase: "4"
    spec:
      containers:
        - name: feature-store-api
          image: gcr.io/omniwatch/feature-store-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8005
              name: http
              protocol: TCP
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otelcol:4317
            - name: CLICKHOUSE_HOST
              value: clickhouse
            - name: CLICKHOUSE_PORT
              value: "8123"
            - name: CLICKHOUSE_DB
              value: omniwatch
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
